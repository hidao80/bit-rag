name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install docker CLI (act only)
        if: ${{ env.ACT }}
        run: which docker || (apt-get update && apt-get install -y docker.io)

      - name: Build Docker image
        run: docker build -t ${{ github.repository }}:${{ github.sha }} .
